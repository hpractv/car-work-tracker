name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Prefer the repo secret when configured. CI never deploys; if the secret is
      # unset, use a clearly CI-only dummy so check:env / session code can run.
      # Dummy value is NOT for production and must never be copied into real secrets.
      SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' && secrets.SESSION_SECRET || 'ci-only-dummy-session-secret-not-for-production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check for committed prisma dev DB
        run: npm run check:no-dev-db
      - name: Check required envs
        run: npm run check:env
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm run test:ci
